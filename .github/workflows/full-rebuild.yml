name: Full font rebuild

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Rebuild and audit every font
        run: pnpm build
      - name: Check generated files
        run: git diff --exit-code
      - name: Audit package delivery sizes
        run: pnpm audit:packages
