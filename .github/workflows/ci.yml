name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  jigmo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build Jigmo
        run: ./scripts/build-jigmo.sh
      - name: Check generated files
        run: git diff --exit-code
  hanamin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build Hanamin
        run: ./scripts/build-hanamin.sh
      - name: Check generated files
        run: git diff --exit-code
      - name: Preserve Hanamin drift for diagnosis
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hanamin-generated-drift
          path: packages/hanamin/dist/HanaMinA/HanaMin.Supplemental-Symbols-and-Pictographs.woff2
  taipei-sans-tc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build Taipei Sans TC
        run: ./scripts/build-taipei-sans-tc.sh
      - name: Check generated files
        run: git diff --exit-code
