name: Changesets release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Audit package delivery sizes
        run: pnpm audit:packages
      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: pnpm release:version
          publish-script: pnpm release:publish
          pr-title: "chore: release packages"
          commit-message: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify npm and jsDelivr publication
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          test "$(echo "$PUBLISHED_PACKAGES" | jq 'length')" -gt 0
          echo "$PUBLISHED_PACKAGES" | jq -c '.[]' | while read -r package; do
            name="$(echo "$package" | jq -r '.name')"
            version="$(echo "$package" | jq -r '.version')"
            for attempt in $(seq 1 20); do
              if [ "$(npm view "$name" version 2>/dev/null || true)" = "$version" ]; then
                break
              fi
              sleep 15
            done
            test "$(npm view "$name" version)" = "$version"
            url="https://cdn.jsdelivr.net/npm/${name}@${version}/dist/index.css"
            curl --fail --silent --show-error "https://purge.jsdelivr.net/npm/${name}@${version}/dist/index.css"
            available=false
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error --head "$url"; then
                available=true
                break
              fi
              sleep 15
            done
            if [ "$available" != true ]; then
              exit 1
            fi
          done
